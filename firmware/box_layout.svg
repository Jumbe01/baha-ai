<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Arial, sans-serif">
<rect width="1400" height="820" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Clean box layout: top view of the wooden base (not to scale; no wire crosses another)</text>

<!-- wooden base -->
<rect x="40" y="70" width="740" height="700" rx="6" fill="#e3c597" stroke="#a07a4a" stroke-width="3"/>
<text x="350" y="62" font-size="11" font-weight="bold" text-anchor="middle">▲ USB cable to ESP32 (top wall hole)</text>
<text x="648" y="800" font-size="11" font-weight="bold" text-anchor="middle">▼ 5V charger cable in (bottom wall hole)</text>

<!-- two breadboards joined -->
<rect x="170" y="110" width="170" height="620" fill="#f4f4f0" stroke="#bbb"/>
<rect x="340" y="110" width="170" height="620" fill="#f4f4f0" stroke="#bbb"/>
<line x1="340" y1="110" x2="340" y2="730" stroke="#999" stroke-dasharray="5 4"/>
<text x="255" y="745" font-size="10" text-anchor="middle" fill="#555">board A</text>
<text x="425" y="745" font-size="10" text-anchor="middle" fill="#555">board B</text>
<text x="340" y="760" font-size="9" text-anchor="middle" fill="#555">middle rails peeled off, boards snapped together</text>
<!-- rails -->
<line x1="182" y1="115" x2="182" y2="725" stroke="#3a7bd5" stroke-width="2"/>
<line x1="196" y1="115" x2="196" y2="725" stroke="#e33" stroke-width="2"/>
