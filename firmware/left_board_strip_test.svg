<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Is the LEFT board itself OK? Three quick tests (everything UNPLUGGED, Ω 200)</text>

<!-- left board a-e half; rows y = 70 + (r-8)*20 for r = 8..32 -->
<rect x="40" y="50" width="340" height="480" fill="#f4f4f0" stroke="#bbb"/>
<line x1="58" y1="56" x2="58" y2="524" stroke="#3a7bd5" stroke-width="3"/>
<line x1="80" y1="56" x2="80" y2="524" stroke="#e33" stroke-width="3"/>
<rect x="320" y="56" width="40" height="468" fill="#e3e3dc"/>
<g font-size="13" font-weight="bold" text-anchor="middle">
<text x="58" y="46" fill="#3a7bd5">−</text><text x="80" y="46" fill="#e33">+</text>
<text x="120" y="46" fill="#555">a</text><text x="165" y="46" fill="#555">b</text><text x="210" y="46" fill="#555">c</text><text x="255" y="46" fill="#555">d</text><text x="300" y="46" fill="#555">e</text>
</g>
<g font-size="12" fill="#555" text-anchor="end" font-weight="bold">
<text x="34" y="114">10</text><text x="34" y="314">20</text><text x="34" y="514">30</text>
</g>
<!-- divider stub -->
<g fill="#c8a165" stroke="#7a5a2a"><rect x="206" y="60" width="8" height="48"/><rect x="161" y="114" width="8" height="96"/><rect x="206" y="214" width="8" height="96"/></g>

<!-- TEST A: b30 + d30 -->
<rect x="159" y="498" width="12" height="24" fill="#2a9d3a"/><rect x="249" y="498" width="12" height="24" fill="#2a9d3a"/>
<ellipse cx="210" cy="510" rx="70" ry="22" fill="none" stroke="#e33" stroke-width="3"/>
<text x="290" y="500" font-size="13" font-weight="bold" fill="#e33">A</text>

<!-- TEST B: D1 present? a20 -> - rail -->
<polyline points="120,310 58,310" fill="none" stroke="#555" stroke-width="5" stroke-dasharray="7 4"/>
<circle cx="120" cy="310" r="6" fill="#555"/><circle cx="58" cy="310" r="6" fill="#555"/>
<text x="86" y="300" font-size="12" font-weight="bold" fill="#1f6fd1">B: is D1 here?</text>

<!-- TEST C: rail itself -->
<rect x="52" y="78" width="12" height="24" fill="#2a9d3a"/><rect x="52" y="478" width="12" height="24" fill="#2a9d3a"/>
<line x1="70" y1="90" x2="70" y2="490" stroke="#c77c00" stroke-width="3" stroke-dasharray="4 4"/>
<text x="90" y="160" font-size="13" font-weight="bold" fill="#c77c00">C</text>

<!-- instructions -->
<g font-size="13" fill="#222">
<text x="410" y="80" font-weight="bold" fill="#e33">A. Do the board's clips work? (red)</text>
<text x="422" y="100">Spare jumpers in <tspan font-weight="bold">b30</tspan> and <tspan font-weight="bold">d30</tspan> (same row, a–e side).</text>
<text x="422" y="118">Probe one jumper pin ↔ the other.</text>
<text x="422" y="138"><tspan font-weight="bold">near 0</tspan> → board + your method are fine.</text>
<text x="422" y="156"><tspan font-weight="bold">OL</tspan> → the meter/probes aren't reaching metal:</text>
<text x="436" y="174">touch the two jumper pins TOGETHER on the probes</text>
<text x="436" y="192">once to confirm the meter shows ~0 when shorted.</text>

<text x="410" y="232" font-weight="bold" fill="#1f6fd1">B. Is D1 actually there? (look)</text>
<text x="422" y="252">A wire from <tspan font-weight="bold">a20</tspan> to the <tspan font-weight="bold">outer (blue) − rail</tspan>, row 20.</text>
<text x="422" y="270">Missing? Add it (MALE–MALE). Then redo Test 2.</text>

<text x="410" y="310" font-weight="bold" fill="#c77c00">C. Is the left − rail whole? (orange)</text>
<text x="422" y="330">Jumpers in the <tspan font-weight="bold">− rail at row 10</tspan> and <tspan font-weight="bold">row 30</tspan>.</text>
<text x="422" y="350"><tspan font-weight="bold">near 0</tspan> → rail OK.   <tspan font-weight="bold">OL</tspan> → rail damaged (the spark?).</text>

<text x="410" y="394" font-weight="bold">Why these first</text>
<text x="422" y="414">Test 2 (d20 ↔ − rail) doesn't involve D2 or the ESP32,</text>
<text x="422" y="432">so its OL means D1 is missing, the left board's clips</text>
<text x="422" y="450">are damaged, or the probes aren't touching metal.</text>
<text x="422" y="474">A, B, C tell these apart.</text>
</g>
</svg>
