<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Arial, sans-serif">
<rect width="1000" height="520" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Safe pump test: 5 V from the breadboard ONLY (never a wall socket)</text>

<!-- warning box -->
<rect x="20" y="44" width="960" height="54" rx="8" fill="#fdecea" stroke="#e0a9a1"/>
<text x="40" y="68" font-size="14" font-weight="bold" fill="#b03a2e">⚠ Wall socket = 220 V. Never connect the pump, sensors, or any project wire to it.</text>
<text x="40" y="88" font-size="12.5" fill="#b03a2e">Everything in this project runs on 5 V from the adapter, through the breadboard rails.</text>

<!-- left rails rows 44-48, below the burnt area -->
<rect x="40" y="120" width="120" height="320" fill="#f4f4f0" stroke="#bbb"/>
<line x1="78" y1="126" x2="78" y2="434" stroke="#3a7bd5" stroke-width="4"/>
<line x1="120" y1="126" x2="120" y2="434" stroke="#e33" stroke-width="4"/>
<g font-size="14" font-weight="bold" text-anchor="middle"><text x="78" y="116" fill="#3a7bd5">−</text><text x="120" y="116" fill="#e33">+</text></g>
<g font-size="12" fill="#555" text-anchor="end" font-weight="bold"><text x="34" y="234">45</text><text x="34" y="404">51</text></g>
<text x="100" y="460" font-size="11" text-anchor="middle" fill="#555">LEFT rails (outer −, inner +)</text>
<!-- adapter terminal -->
<rect x="62" y="380" width="74" height="40" rx="4" fill="#1f6fd1"/>
<text x="99" y="405" font-size="10" fill="#fff" text-anchor="middle">adapter</text>

<!-- cup + pump -->
<path d="M430,250 L442,420 L588,420 L600,250 Z" fill="#d9ecfa" stroke="#555" stroke-width="2"/>
<rect x="440" y="290" width="150" height="128" fill="#7fb8e6" opacity="0.7"/>
<rect x="480" y="360" width="70" height="50" rx="6" fill="#555"/>
<text x="515" y="390" font-size="12" fill="#fff" text-anchor="middle">PUMP</text>
<text x="515" y="440" font-size="12" text-anchor="middle">fully under water</text>

<!-- wires -->
<polyline points="120,230 300,230 300,372 480,372" fill="none" stroke="#c0392b" stroke-width="5"/>
<polyline points="78,250 280,250 280,396 480,396" fill="none" stroke="#111" stroke-width="5"/>
<circle cx="120" cy="230" r="6" fill="#c0392b"/><circle cx="78" cy="250" r="6" fill="#111"/>
<g font-size="12" font-weight="bold">
<text x="130" y="222" fill="#c0392b">pump red → + rail, row 45</text>
<text x="130" y="270">pump black → − rail, row 45</text>
</g>

<g font-size="13" fill="#222">
<text x="640" y="140" font-weight="bold">Steps</text>
<text x="652" y="162">1. Adapter UNPLUGGED.</text>
<text x="652" y="182">2. Pump in a cup of water.</text>
<text x="652" y="202">3. Red → left + rail row 45 (inner).</text>
<text x="652" y="222">   Black → left − rail row 45 (outer).</text>
<text x="652" y="242">4. Plug the adapter into the wall.</text>

<text x="640" y="282" font-weight="bold">Result</text>
<text x="652" y="302"><tspan font-weight="bold" fill="#2a9d3a">Pumps / hums</tspan> → it survived; next we</text>
<text x="666" y="320">wire it to the relay (K1).</text>
<text x="652" y="344"><tspan font-weight="bold" fill="#c0392b">Nothing, or a burnt smell</tspan> → unplug at once;</text>
<text x="666" y="362">the pump is dead. Buy a new</text>
<text x="666" y="380">"3–6V mini submersible pump".</text>
</g>
</svg>
