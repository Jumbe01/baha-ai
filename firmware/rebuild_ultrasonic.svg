<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
<rect width="1000" height="600" fill="#fff"/>
<text x="20" y="26" font-size="16" font-weight="bold">Ultrasonic (HC-SR04): LEFT board (zoomed, rows 1–28)</text>

<!-- left board: rails - outer, + inner; y = 50 + r*17 -->
<rect x="38" y="50" width="220" height="500" fill="#f4f4f0" stroke="#bbb"/>
<line x1="50" y1="56" x2="50" y2="544" stroke="#3a7bd5" stroke-width="3"/>
<line x1="66" y1="56" x2="66" y2="544" stroke="#e33" stroke-width="3"/>
<rect x="140" y="56" width="22" height="488" fill="#e8e8e2"/>
<g font-size="12" font-weight="bold" text-anchor="middle"><text x="50" y="46" fill="#3a7bd5">−</text><text x="66" y="46" fill="#e33">+</text></g>
<g font-size="10" fill="#555" text-anchor="middle">
<text x="85" y="46">a</text><text x="97" y="46">b</text><text x="109" y="46">c</text><text x="121" y="46">d</text><text x="133" y="46">e</text>
<text x="170" y="46">f</text><text x="182" y="46">g</text><text x="194" y="46">h</text><text x="206" y="46">i</text><text x="218" y="46">j</text>
</g>
<g font-size="10" fill="#555" text-anchor="end" font-weight="bold">
<text x="34" y="139">5</text><text x="34" y="224">10</text><text x="34" y="241">11</text><text x="34" y="309">15</text><text x="34" y="394">20</text><text x="34" y="462">24</text><text x="34" y="479">25</text><text x="34" y="530">28</text>
</g>

<!-- ESP32 left part, pins in g, rows 3-21 -->
<rect x="176" y="92" width="82" height="318" fill="#222"/>
<g fill="#d4af37"><circle cx="182" cy="220" r="3.5"/><circle cx="182" cy="237" r="3.5"/></g>
<g font-size="10" fill="#fff"><text x="192" y="224" fill="#ffd166" font-weight="bold">P16</text><text x="192" y="241" fill="#ffd166" font-weight="bold">P17</text></g>
<text x="256" y="88" font-size="9" text-anchor="end" fill="#555">ESP32 →</text>

<!-- divider + D1 + D2 (already in) -->
<g fill="#c8a165" stroke="#7a5a2a"><rect x="106" y="140" width="6" height="76"/><rect x="94" y="225" width="6" height="76"/><rect x="106" y="310" width="6" height="76"/></g>
<text x="114" y="182" font-size="9" fill="#7a5a2a">R1</text><text x="74" y="266" font-size="9" fill="#7a5a2a">R2</text><text x="114" y="352" font-size="9" fill="#7a5a2a">R3</text>
<polyline points="85,390 50,390" fill="none" stroke="#555" stroke-width="3" opacity="0.6"/>
<polyline points="133,220 170,220" fill="none" stroke="#8e44ad" stroke-width="3" opacity="0.6"/>
<text x="62" y="384" font-size="9" fill="#555">D1</text><text x="138" y="212" font-size="9" fill="#8e44ad">D2</text>

<!-- HC-SR04 wires -->
<polyline points="8,135 85,135" fill="none" stroke="#e67e22" stroke-width="4"/>
<circle cx="85" cy="135" r="5" fill="#e67e22"/>
<polyline points="8,458 50,458" fill="none" stroke="#c9a400" stroke-width="4"/>
<circle cx="50" cy="458" r="5" fill="#c9a400"/>
<polyline points="8,475 66,475" fill="none" stroke="#8b4513" stroke-width="4"/>
<circle cx="66" cy="475" r="5" fill="#8b4513"/>
<polyline points="8,526 151,526 151,237 170,237" fill="none" stroke="#e33" stroke-width="4"/>
<circle cx="170" cy="237" r="5" fill="#e33"/>
<text x="154" y="420" font-size="9" fill="#e33">Trig runs</text><text x="154" y="432" font-size="9" fill="#e33">up the gap</text>

<!-- instructions -->
<g font-size="13" fill="#222">
<text x="300" y="70" font-weight="bold">Unplug the charger and USB first.</text>
<text x="300" y="100" font-weight="bold">Wire type: FEMALE–MALE (×4)</text>
<text x="312" y="118">Female end on the sensor's pins, male end into the board.</text>
<text x="312" y="136">Read the tiny labels on the sensor: Vcc, Trig, Echo, Gnd.</text>

<text x="300" y="172" font-weight="bold">Where each wire goes</text>
<text x="312" y="194"><tspan fill="#e67e22" font-weight="bold">Echo</tspan> → <tspan font-weight="bold">a5</tspan>   (same row as R1's top leg; goes through the divider)</text>
<text x="312" y="216"><tspan fill="#e33" font-weight="bold">Trig</tspan> → <tspan font-weight="bold">f11</tspan>  (beside P17; lay it up the empty middle gap)</text>
<text x="312" y="238"><tspan fill="#8b4513" font-weight="bold">Vcc</tspan>  → left <tspan font-weight="bold">+ rail</tspan>, row 25  (INNER rail, red line)</text>
<text x="312" y="260"><tspan fill="#a68800" font-weight="bold">Gnd</tspan>  → left <tspan font-weight="bold">− rail</tspan>, row 24  (OUTER rail, blue line)</text>

<text x="300" y="296" font-weight="bold" fill="#c0392b">Never put Echo straight into f10 or beside P16:</text>
<text x="300" y="314" fill="#c0392b">Echo is 5V and must go through the divider.</text>

<text x="300" y="352" font-weight="bold">Already in (don't move)</text>
<text x="312" y="372">R1 c5–c10, R2 b10–b15, R3 c15–c20, D1 a20 → −, D2 e10 → f10</text>

<text x="300" y="410" font-weight="bold">Test</text>
<text x="312" y="430">1. Charger + USB on. Upload <tspan font-weight="bold">gate2_ultrasonic</tspan>.</text>
<text x="312" y="450">2. Serial Monitor 115200: move your hand over the sensor.</text>
<text x="326" y="470">The cm number should follow your hand.</text>
<text x="312" y="490">3. "no echo" every time? Check Trig/Echo aren't swapped.</text>
</g>
</svg>
