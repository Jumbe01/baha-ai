<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Is the sensor itself alive? Fire it by hand (adapter ON, ESP32 USB ON)</text>

<!-- left board strip rows 19 + 25, f-j -->
<rect x="40" y="70" width="420" height="300" fill="#f4f4f0" stroke="#bbb"/>
<g font-size="14" font-weight="bold" fill="#555" text-anchor="middle">
<text x="120" y="62">f</text><text x="190" y="62">g</text><text x="260" y="62">h</text><text x="330" y="62">i</text><text x="400" y="62">j</text>
</g>
<g font-size="13" fill="#555" text-anchor="end" font-weight="bold"><text x="34" y="124">19</text><text x="34" y="304">25</text></g>
<!-- ESP32 pins in j -->
<rect x="385" y="90" width="75" height="270" fill="#222"/>
<g fill="#d4af37"><circle cx="400" cy="120" r="7"/><circle cx="400" cy="300" r="7"/></g>
<g font-size="11" fill="#fff"><text x="412" y="124" fill="#9be7a0" font-weight="bold">3V3</text><text x="412" y="304">D17</text></g>
<g fill="#999"><circle cx="190" cy="120" r="5"/><circle cx="260" cy="120" r="5"/><circle cx="190" cy="300" r="5"/><circle cx="260" cy="300" r="5"/></g>

<!-- blue trig wire pulled from f25 -->
<polyline points="20,420 120,420 120,330" fill="none" stroke="#2457c5" stroke-width="6"/>
<rect x="112" y="318" width="16" height="22" fill="#222"/>
<rect x="117" y="306" width="6" height="14" fill="#bbb"/>
<text x="140" y="410" font-size="13" font-weight="bold" fill="#2457c5">blue Trig wire, pulled OUT of f25</text>
<!-- tap arrow to g19 (3V3 strip) -->
<path d="M120,300 C120,220 190,200 190,135" fill="none" stroke="#e33" stroke-width="3" stroke-dasharray="7 5"/>
<polygon points="190,128 183,142 197,142" fill="#e33"/>
<circle cx="190" cy="120" r="16" fill="none" stroke="#e33" stroke-width="3"/>
<text x="210" y="190" font-size="13" font-weight="bold" fill="#e33">tap its pin into g19</text>
<text x="210" y="208" font-size="12" fill="#e33">(3V3 row) for ~1 second</text>

<!-- ear -->
<circle cx="560" cy="160" r="32" fill="#222"/><circle cx="560" cy="160" r="18" fill="#444"/>
<text x="560" y="214" font-size="12" text-anchor="middle">probe head by your ear</text>
<path d="M600,140 q14,20 0,40 M612,132 q22,28 0,56" fill="none" stroke="#3a7bd5" stroke-width="3"/>

<g font-size="13" fill="#222">
<text x="680" y="90" font-weight="bold">How</text>
<text x="692" y="110">1. Pull the blue Trig wire out of <tspan font-weight="bold">f25</tspan>.</text>
<text x="692" y="130">2. Hold the probe head next to your ear.</text>
<text x="692" y="150">3. Tap the blue wire's pin into <tspan font-weight="bold">g19</tspan></text>
<text x="706" y="168">(the ESP32's 3V3 row) for 1 second, out again.</text>
<text x="692" y="188">4. Do it 3–4 times. Listen for a "tick".</text>

<text x="680" y="230" font-weight="bold">Result</text>
<text x="692" y="250"><tspan font-weight="bold" fill="#2a9d3a">Ticks</tspan> → the sensor works. The ESP32</text>
<text x="706" y="268">isn't sending the pulse → tell me, I'll</text>
<text x="706" y="286">check the pin in software.</text>
<text x="692" y="310"><tspan font-weight="bold" fill="#c0392b">Silent</tspan> → the sensor (or its probe</text>
<text x="706" y="328">cable/plug) is the problem: re-seat the</text>
<text x="706" y="346">probe plug; if still silent, it may have</text>
<text x="706" y="364">been damaged by the spark.</text>

<text x="680" y="408" font-weight="bold">Then</text>
<text x="692" y="428">Put the blue wire back in <tspan font-weight="bold">f25</tspan>.</text>
</g>
<text x="40" y="470" font-size="12" fill="#555">Your readings: 4.5 V at the sensor = OK (it runs on 3–5.5 V). Trig wire 1.9 Ω = connected.</text>
<text x="40" y="488" font-size="12" fill="#555">So power and wiring are fine; this test tells whether the sensor itself still fires.</text>
</svg>
