<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Arial, sans-serif">
<rect width="1000" height="580" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Waterproof sensor silent → re-seat its probe plug, or swap in the small HC-SR04</text>

<!-- A: probe plug -->
<text x="40" y="66" font-size="14" font-weight="bold">A. Last try on the waterproof one</text>
<rect x="60" y="80" width="200" height="130" rx="8" fill="#2d6fd1"/>
<rect x="44" y="110" width="30" height="44" fill="#eee" stroke="#555" stroke-width="2"/>
<polyline points="44,132 10,132" stroke="#111" stroke-width="7"/>
<circle cx="59" cy="132" r="30" fill="none" stroke="#ffb000" stroke-width="3"/>
<text x="160" y="150" font-size="12" fill="#fff" text-anchor="middle">AJ-SR04M board</text>
<g font-size="12.5" fill="#222">
<text x="290" y="100">1. UNPLUG power. Pull the probe-head plug out.</text>
<text x="290" y="120">2. Look: bent/black pins? Push it back in firmly.</text>
<text x="290" y="140">3. Power on, repeat the hand-tap test (blue → g19).</text>
<text x="290" y="160">Still silent → the sensor is likely damaged (the spark).</text>
</g>

<line x1="20" y1="232" x2="980" y2="232" stroke="#ddd"/>

<!-- B: HC-SR04 -->
<text x="40" y="266" font-size="14" font-weight="bold">B. Swap in the HC-SR04 (two silver "eyes"). Same 4 holes, no code change</text>
<rect x="60" y="290" width="240" height="110" rx="8" fill="#1f6fd1"/>
<circle cx="120" cy="335" r="34" fill="#ccc" stroke="#777" stroke-width="3"/><circle cx="240" cy="335" r="34" fill="#ccc" stroke="#777" stroke-width="3"/>
<g fill="#d4af37"><rect x="136" y="398" width="8" height="18"/><rect x="160" y="398" width="8" height="18"/><rect x="184" y="398" width="8" height="18"/><rect x="208" y="398" width="8" height="18"/></g>
<g font-size="12" font-weight="bold" text-anchor="middle"><text x="140" y="432">Vcc</text><text x="164" y="448">Trig</text><text x="188" y="432">Echo</text><text x="212" y="448">Gnd</text></g>

<g stroke-width="4" fill="none">
<polyline points="140,416 140,470 400,470" stroke="#d4b000"/>
<polyline points="164,452 164,492 400,492" stroke="#2457c5"/>
<polyline points="188,436 188,514 400,514" stroke="#27ae60"/>
<polyline points="212,452 212,536 400,536" stroke="#7a3fa0"/>
</g>
<g font-size="13" font-weight="bold">
<text x="410" y="474" fill="#a68800">Vcc  → left + rail, row 25 (INNER, red)</text>
<text x="410" y="496" fill="#2457c5">Trig → f25</text>
<text x="410" y="518" fill="#27ae60">Echo → a19 (through the divider)</text>
<text x="410" y="540" fill="#7a3fa0">Gnd  → left − rail, row 24 (OUTER, blue)</text>
</g>
<g font-size="12.5" fill="#222">
<text x="330" y="300">Use FEMALE–MALE wires (female on the sensor pins).</text>
<text x="330" y="320">Read the labels printed under its pins.</text>
<text x="330" y="346">Test: gate2_ultrasonic → hand 10–50 cm above it</text>
<text x="330" y="364">→ cm numbers that follow your hand.</text>
<text x="330" y="390">Bonus for the jug: HC-SR04 works from 2 cm</text>
<text x="330" y="408">(waterproof one is blind under ~25 cm).</text>
</g>
</svg>
