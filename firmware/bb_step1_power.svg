<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, sans-serif">
<defs>
  <pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" x="85" y="55">
    <rect x="3" y="3" width="4" height="4" fill="#999"/>
  </pattern>
  <pattern id="r" width="14" height="10" patternUnits="userSpaceOnUse" x="43" y="55">
    <rect x="5" y="3" width="4" height="4" fill="#999"/>
  </pattern>
</defs>
<rect width="900" height="700" fill="#fff"/>
<text x="20" y="24" font-size="15" font-weight="bold">Breadboard Step 1: Power to the rails</text>

<!-- breadboard body -->
<rect x="30" y="40" width="234" height="630" rx="6" fill="#f4f4f0" stroke="#ccc"/>
<rect x="43" y="55" width="28" height="600" fill="url(#r)"/>
<rect x="219" y="55" width="28" height="600" fill="url(#r)"/>
<rect x="85" y="55" width="50" height="600" fill="url(#h)"/>
<rect x="155" y="55" width="50" height="600" fill="url(#h)"/>
<line x1="44" y1="50" x2="44" y2="660" stroke="#3a7bd5"/><line x1="70" y1="50" x2="70" y2="660" stroke="#e33"/>
<line x1="220" y1="50" x2="220" y2="660" stroke="#3a7bd5"/><line x1="246" y1="50" x2="246" y2="660" stroke="#e33"/>
<g font-size="11" font-weight="bold" text-anchor="middle">
<text x="50" y="48" fill="#3a7bd5">−</text><text x="64" y="48" fill="#e33">+</text>
<text x="226" y="48" fill="#3a7bd5">−</text><text x="240" y="48" fill="#e33">+</text>
</g>
<g font-size="9" fill="#555" text-anchor="middle">
<text x="90" y="52">a</text><text x="100" y="52">b</text><text x="110" y="52">c</text><text x="120" y="52">d</text><text x="130" y="52">e</text>
<text x="160" y="52">f</text><text x="170" y="52">g</text><text x="180" y="52">h</text><text x="190" y="52">i</text><text x="200" y="52">j</text>
<text x="145" y="64">1</text><text x="145" y="164">11</text><text x="145" y="264">21</text><text x="145" y="364">31</text><text x="145" y="464">41</text><text x="145" y="564">51</text><text x="145" y="654">60</text>
</g>
<text x="147" y="690" font-size="10" fill="#555" text-anchor="middle">LEFT = 5V  |  RIGHT = 3V3</text>

<!-- 1: USB cable to left rails, row 2 -->
<polyline points="5,90 64,90 64,70" fill="none" stroke="#e33" stroke-width="3"/>
<polyline points="5,100 50,100 50,70" fill="none" stroke="#2a9d3a" stroke-width="3"/>
<circle cx="64" cy="70" r="4" fill="#e33"/><circle cx="50" cy="70" r="4" fill="#2a9d3a"/>
<text x="8" y="84" font-size="10" fill="#222">1</text>

<!-- 2: capacitor row 28 -->
<rect x="47" y="322" width="20" height="18" rx="3" fill="#222"/>
<rect x="47" y="322" width="6" height="18" fill="#bbb"/>
<text x="8" y="336" font-size="10" fill="#222">2</text>

<!-- 3: ESP32 GND to left - rail row 45 -->
<polyline points="5,500 50,500" fill="none" stroke="#111" stroke-width="3"/>
<circle cx="50" cy="500" r="4" fill="#111"/>
<text x="8" y="494" font-size="10" fill="#222">3</text>

<!-- 4: ESP32 3V3 to right + rail row 2 -->
<polyline points="290,70 240,70" fill="none" stroke="#f39c12" stroke-width="3"/>
<circle cx="240" cy="70" r="4" fill="#f39c12"/>
<text x="280" y="64" font-size="10" fill="#222">4</text>

<!-- 5: GND bridge row 60 -->
<polyline points="50,650 50,664 226,664 226,650" fill="none" stroke="#e6c200" stroke-width="3"/>
<circle cx="50" cy="650" r="4" fill="#e6c200"/><circle cx="226" cy="650" r="4" fill="#e6c200"/>
<text x="136" y="678" font-size="10" fill="#222">5</text>

<!-- instructions -->
<g font-size="13" fill="#222">
<text x="320" y="70" font-weight="bold">What goes where (in order):</text>
<text x="320" y="100"><tspan font-weight="bold" fill="#2a9d3a">✓ 1</tspan>  Charger USB cable, row 2:</text>
<text x="340" y="118">red → LEFT + rail,  green → LEFT − rail</text>
<text x="340" y="136">(keep the charger unplugged for now)</text>
<text x="320" y="166"><tspan font-weight="bold" fill="#2a9d3a">✓ 2</tspan>  470µF capacitor, row 28, across the left rails</text>
<text x="340" y="184">grey STRIPE goes in the − (blue) rail</text>
<text x="320" y="214"><tspan font-weight="bold">3</tspan>  ESP32 GND pin → LEFT − rail (any row)</text>
<text x="340" y="232">do NOT connect the ESP32 5V pin</text>
<text x="320" y="262"><tspan font-weight="bold">4</tspan>  ESP32 3V3 pin → RIGHT + rail (outermost column)</text>
<text x="340" y="280">(feeds the DHT22 and rain sensor)</text>
<text x="320" y="310"><tspan font-weight="bold" fill="#2a9d3a">✓ 5</tspan>  Jumper at row 60: LEFT − rail → RIGHT − rail</text>
<text x="340" y="328">(one shared GND for the whole board)</text>

<text x="320" y="374" font-weight="bold">Multimeter check (Ω 200, everything unplugged):</text>
<text x="320" y="398">• Left − row 1  ↔  left − row 60  →  close to 0</text>
<text x="320" y="418">• Left + row 1  ↔  left + row 60  →  close to 0</text>
<text x="340" y="436">(if OL: the rail is split in the middle — add a jumper)</text>
<text x="320" y="456">• Left +  ↔  left −  →  OL (may climb slowly to OL)</text>
<text x="320" y="476">• Left −  ↔  right −  →  close to 0</text>

<text x="320" y="522" font-weight="bold">Wire colours:</text>
<line x1="320" y1="540" x2="350" y2="540" stroke="#e33" stroke-width="3"/><text x="358" y="544">5V</text>
<line x1="400" y1="540" x2="430" y2="540" stroke="#111" stroke-width="3"/><text x="438" y="544">GND</text>
<line x1="490" y1="540" x2="520" y2="540" stroke="#f39c12" stroke-width="3"/><text x="528" y="544">3V3</text>
<line x1="580" y1="540" x2="610" y2="540" stroke="#2a9d3a" stroke-width="3"/><text x="618" y="544">green in cable = GND</text>
<line x1="320" y1="566" x2="350" y2="566" stroke="#e6c200" stroke-width="3"/><text x="358" y="570">your yellow jumper (GND bridge)</text>
</g>
</svg>
