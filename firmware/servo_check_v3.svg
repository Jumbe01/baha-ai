<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
<rect width="1000" height="600" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Servo not moving: 4 checks in order</text>

<!-- rails + board region -->
<rect x="40" y="60" width="300" height="400" fill="#f4f4f0" stroke="#bbb"/>
<g font-size="13" font-weight="bold" fill="#555" text-anchor="middle"><text x="200" y="54">j</text><text x="270" y="54" fill="#3a7bd5">−</text><text x="300" y="54" fill="#e33">+</text></g>
<line x1="270" y1="66" x2="270" y2="454" stroke="#3a7bd5" stroke-width="3"/>
<line x1="300" y1="66" x2="300" y2="454" stroke="#e33" stroke-width="3"/>
<g font-size="12" fill="#555" text-anchor="end" font-weight="bold"><text x="34" y="124">26</text><text x="34" y="324">30</text><text x="34" y="364">31</text></g>
<rect x="40" y="66" width="110" height="120" fill="#222"/>
<circle cx="135" cy="120" r="8" fill="#d4af37"/><text x="122" y="124" font-size="11" fill="#ffd166" text-anchor="end" font-weight="bold">D25</text>

<!-- servo jumpers -->
<circle cx="200" cy="120" r="7" fill="#e67e22"/><circle cx="300" cy="320" r="7" fill="#e33"/><circle cx="270" cy="360" r="7" fill="#8b4513"/>
<polyline points="200,120 420,120 420,250 560,250" fill="none" stroke="#e67e22" stroke-width="4"/>
<polyline points="300,320 440,320 440,264 560,264" fill="none" stroke="#e33" stroke-width="4"/>
<polyline points="270,360 460,360 460,278 560,278" fill="none" stroke="#8b4513" stroke-width="4"/>
<rect x="560" y="240" width="24" height="48" fill="#222"/>
<rect x="600" y="232" width="140" height="66" rx="8" fill="#1f4fa8"/>
<text x="670" y="270" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">SERVO</text>
<text x="572" y="232" font-size="10" text-anchor="middle">plug</text>

<!-- markers -->
<circle cx="300" cy="320" r="17" fill="none" stroke="#e33" stroke-width="3"/>
<circle cx="270" cy="360" r="17" fill="none" stroke="#e33" stroke-width="3"/>
<text x="350" y="408" font-size="13" font-weight="bold" fill="#e33">② 5 V here?</text>
<circle cx="135" cy="120" r="18" fill="none" stroke="#2a9d3a" stroke-width="3" stroke-dasharray="5 3"/>
<circle cx="560" cy="250" r="15" fill="none" stroke="#2a9d3a" stroke-width="3" stroke-dasharray="5 3"/>
<text x="250" y="150" font-size="13" font-weight="bold" fill="#2a9d3a">③ signal path</text>
<circle cx="572" cy="264" r="34" fill="none" stroke="#c77c00" stroke-width="3"/>
<text x="600" y="330" font-size="13" font-weight="bold" fill="#c77c00">④ plug order</text>

<g font-size="13" fill="#222">
<text x="40" y="490" font-weight="bold">① Is gate8_servo running?</text>
<text x="52" y="510">Serial Monitor 115200 should print the servo test lines (open / closed).</text>
<text x="52" y="528">Still showing "Gate 7: relay test"? → upload gate8_servo again.</text>

<text x="520" y="80" font-weight="bold" fill="#e33">② Power (adapter ON, V⎓20)</text>
<text x="532" y="100">right + rail r30 ↔ right − rail r31 → ≈ 5 V?</text>
<text x="532" y="118">0 V → rails not fed: check bridges B/C (rows 57/60).</text>

<text x="520" y="156" font-weight="bold" fill="#2a9d3a">③ Signal (UNPLUGGED, Ω 200)</text>
<text x="532" y="176">ESP32 D25 pin ↔ the metal of the jumper in the</text>
<text x="532" y="194">servo plug's ORANGE socket → near 0?</text>

<text x="520" y="350" font-weight="bold" fill="#c77c00">④ Plug order</text>
<text x="532" y="370">Each jumper must sit in the socket of the</text>
<text x="532" y="388">matching colour: orange → j26, red → + r30,</text>
<text x="532" y="406">brown → − r31. Easy to shift one socket.</text>
</g>
</svg>
