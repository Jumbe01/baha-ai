<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
<rect width="1000" height="600" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Step 4: ultrasonic Trig + power. LEFT board rows 18–36 (everything UNPLUGGED to wire)</text>

<!-- y = 70 + (r-18)*28 -->
<rect x="40" y="50" width="480" height="530" fill="#f4f4f0" stroke="#bbb"/>
<line x1="58" y1="56" x2="58" y2="574" stroke="#3a7bd5" stroke-width="3"/>
<line x1="80" y1="56" x2="80" y2="574" stroke="#e33" stroke-width="3"/>
<rect x="300" y="56" width="35" height="518" fill="#e3e3dc"/>
<g font-size="13" font-weight="bold" text-anchor="middle">
<text x="58" y="46" fill="#3a7bd5">−</text><text x="80" y="46" fill="#e33">+</text>
<text x="120" y="46" fill="#555">a</text><text x="160" y="46" fill="#555">b</text><text x="200" y="46" fill="#555">c</text><text x="240" y="46" fill="#555">d</text><text x="280" y="46" fill="#555">e</text>
<text x="355" y="46" fill="#555">f</text><text x="390" y="46" fill="#555">g</text><text x="425" y="46" fill="#555">h</text><text x="460" y="46" fill="#555">i</text><text x="495" y="46" fill="#555">j</text>
</g>
<g font-size="12" fill="#555" text-anchor="end" font-weight="bold">
<text x="34" y="102">19</text><text x="34" y="242">24</text><text x="34" y="270">25</text><text x="34" y="382">29</text><text x="34" y="522">34</text>
</g>

<!-- ESP32 left edge, pins in j -->
<rect x="482" y="86" width="38" height="420" fill="#222"/>
<g fill="#d4af37"><circle cx="495" cy="238" r="5"/><circle cx="495" cy="266" r="6"/></g>
<g font-size="9" fill="#fff"><text x="485" y="232">D16</text><text x="485" y="284" fill="#ffd166" font-weight="bold">D17</text></g>

<!-- existing divider + wires (grey) -->
<g opacity="0.55">
<g fill="#c8a165" stroke="#7a5a2a"><rect x="196" y="104" width="8" height="128"/><rect x="156" y="244" width="8" height="128"/><rect x="196" y="384" width="8" height="128"/></g>
<polyline points="280,238 355,238" fill="none" stroke="#8e44ad" stroke-width="5"/>
<polyline points="120,518 58,518" fill="none" stroke="#111" stroke-width="5"/>
</g>
<text x="210" y="170" font-size="11" fill="#7a5a2a">R1</text><text x="132" y="310" font-size="11" fill="#7a5a2a">R2</text><text x="210" y="450" font-size="11" fill="#7a5a2a">R3</text>
<text x="290" y="230" font-size="11" fill="#8e44ad">D2</text><text x="70" y="510" font-size="11">D1</text>

<!-- Echo a19 (in) -->
<polyline points="8,98 120,98" fill="none" stroke="#27ae60" stroke-width="4"/>
<circle cx="120" cy="98" r="6" fill="#27ae60"/>
<text x="10" y="90" font-size="11" font-weight="bold" fill="#27ae60">Echo (green) a19 ✓</text>

<!-- Vcc/Gnd -->
<polyline points="8,238 58,238" fill="none" stroke="#7a3fa0" stroke-width="4"/>
<circle cx="58" cy="238" r="6" fill="#7a3fa0"/>
<polyline points="8,266 80,266" fill="none" stroke="#d4b000" stroke-width="4"/>
<circle cx="80" cy="266" r="6" fill="#d4b000"/>
<text x="10" y="230" font-size="11" font-weight="bold" fill="#7a3fa0">Gnd (violet) → − r24</text>
<text x="10" y="286" font-size="11" font-weight="bold" fill="#a68800">Vcc (yellow) → + r25</text>

<!-- NEW Trig: from below, up the gap, into f25 -->
<polyline points="8,550 317,550 317,266 355,266" fill="none" stroke="#2457c5" stroke-width="6"/>
<circle cx="355" cy="266" r="8" fill="#2457c5"/>
<text x="10" y="542" font-size="12" font-weight="bold" fill="#2457c5">Trig (blue) NEW → f25</text>
<text x="322" y="420" font-size="11" fill="#2457c5" font-weight="bold" transform="rotate(90 322 420)">lay it up the gap</text>

<!-- instructions -->
<g font-size="13" fill="#222">
<text x="550" y="80" font-weight="bold">1. Wire (FEMALE end on the sensor)</text>
<text x="562" y="100"><tspan font-weight="bold" fill="#2457c5">Trig (blue)</tspan> → <tspan font-weight="bold">f25</tspan></text>
<text x="562" y="118">f25 = beside the ESP32's D17 (7th left pin).</text>
<text x="562" y="136">Bring it up the empty gap so it doesn't</text>
<text x="562" y="154">cross the resistors.</text>

<text x="550" y="192" font-weight="bold">2. Check the sensor's power wires</text>
<text x="562" y="212"><tspan font-weight="bold" fill="#a68800">Vcc (yellow)</tspan> → left <tspan font-weight="bold">+ rail</tspan> row 25 (INNER, red)</text>
<text x="562" y="230"><tspan font-weight="bold" fill="#7a3fa0">Gnd (violet)</tspan> → left <tspan font-weight="bold">− rail</tspan> row 24 (OUTER, blue)</text>
<text x="562" y="248">(both are below the burnt rows ✓)</text>

<text x="550" y="286" font-weight="bold" fill="#e33">3. Test (Ω 200, unplugged)</text>
<text x="562" y="306">sensor <tspan font-weight="bold">Trig</tspan> blob ↔ ESP32 <tspan font-weight="bold">D17 pin</tspan> → near 0</text>

<text x="550" y="344" font-weight="bold">4. Power test</text>
<text x="562" y="364">• Plug in the adapter (rails) and the ESP32's USB-C.</text>
<text x="562" y="382">• Upload <tspan font-weight="bold">gate2_ultrasonic</tspan>.</text>
<text x="562" y="400">• Serial Monitor 115200: point the sensor at a</text>
<text x="576" y="418">wall 50 cm – 2 m away → cm numbers appear.</text>

<text x="550" y="458" fill="#c0392b" font-weight="bold">Before plugging in the adapter:</text>
<text x="550" y="476" fill="#c0392b">Ω 200 between the blue terminal's two screws</text>
<text x="550" y="494" fill="#c0392b">must NOT be near 0 (that would be a short).</text>
</g>
</svg>
