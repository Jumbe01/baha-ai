<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, sans-serif">
<defs>
  <pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" x="85" y="55">
    <rect x="3" y="3" width="4" height="4" fill="#999"/>
  </pattern>
  <pattern id="r" width="14" height="10" patternUnits="userSpaceOnUse" x="43" y="55">
    <rect x="5" y="3" width="4" height="4" fill="#999"/>
  </pattern>
</defs>
<rect width="900" height="700" fill="#fff"/>
<text x="20" y="24" font-size="15" font-weight="bold">Breadboard Step 2: Ultrasonic sensor + divider</text>

<!-- breadboard body -->
<rect x="30" y="40" width="234" height="630" rx="6" fill="#f4f4f0" stroke="#ccc"/>
<rect x="43" y="55" width="28" height="600" fill="url(#r)"/>
<rect x="219" y="55" width="28" height="600" fill="url(#r)"/>
<rect x="85" y="55" width="50" height="600" fill="url(#h)"/>
<rect x="155" y="55" width="50" height="600" fill="url(#h)"/>
<line x1="44" y1="50" x2="44" y2="660" stroke="#3a7bd5"/><line x1="70" y1="50" x2="70" y2="660" stroke="#e33"/>
<line x1="220" y1="50" x2="220" y2="660" stroke="#3a7bd5"/><line x1="246" y1="50" x2="246" y2="660" stroke="#e33"/>
<g font-size="11" font-weight="bold" text-anchor="middle">
<text x="50" y="48" fill="#3a7bd5">−</text><text x="64" y="48" fill="#e33">+</text>
<text x="226" y="48" fill="#3a7bd5">−</text><text x="240" y="48" fill="#e33">+</text>
</g>
<g font-size="9" fill="#555" text-anchor="middle">
<text x="90" y="52">a</text><text x="100" y="52">b</text><text x="110" y="52">c</text><text x="120" y="52">d</text><text x="130" y="52">e</text>
<text x="160" y="52">f</text><text x="170" y="52">g</text><text x="180" y="52">h</text><text x="190" y="52">i</text><text x="200" y="52">j</text>
<text x="145" y="64">1</text><text x="145" y="164">11</text><text x="145" y="264">21</text><text x="145" y="364">31</text><text x="145" y="464">41</text><text x="145" y="564">51</text><text x="145" y="654">60</text>
</g>
<text x="147" y="690" font-size="10" fill="#555" text-anchor="middle">LEFT = 5V  |  RIGHT = 3V3</text>


<!-- already done (faded) -->
<g opacity="0.35">
<polyline points="5,90 64,90 64,70" fill="none" stroke="#e33" stroke-width="3"/>
<polyline points="5,100 50,100 50,70" fill="none" stroke="#2a9d3a" stroke-width="3"/>
<rect x="47" y="322" width="20" height="18" rx="3" fill="#222"/>
<polyline points="50,650 50,664 226,664 226,650" fill="none" stroke="#e6c200" stroke-width="3"/>
</g>

<!-- R1 c5-c10, R2 b10-b15, R3 c15-c20 -->
<line x1="110" y1="100" x2="110" y2="150" stroke="#777" stroke-width="2"/>
<rect x="105" y="112" width="10" height="26" rx="3" fill="#4a90d9"/>
<line x1="100" y1="150" x2="100" y2="200" stroke="#777" stroke-width="2"/>
<rect x="95" y="162" width="10" height="26" rx="3" fill="#4a90d9"/>
<line x1="110" y1="200" x2="110" y2="250" stroke="#777" stroke-width="2"/>
<rect x="105" y="212" width="10" height="26" rx="3" fill="#4a90d9"/>
<g font-size="10" fill="#222" font-weight="bold">
<text x="117" y="129">R1</text><text x="80" y="179">R2</text><text x="117" y="229">R3</text>
</g>
<circle cx="110" cy="100" r="3" fill="#333"/><circle cx="110" cy="150" r="3" fill="#333"/>
<circle cx="100" cy="150" r="3" fill="#333"/><circle cx="100" cy="200" r="3" fill="#333"/>
<circle cx="110" cy="200" r="3" fill="#333"/><circle cx="110" cy="250" r="3" fill="#333"/>

<!-- a20 to left - rail -->
<polyline points="90,250 50,250" fill="none" stroke="#111" stroke-width="3"/>
<circle cx="90" cy="250" r="4" fill="#111"/><circle cx="50" cy="250" r="4" fill="#111"/>

<!-- ECHO into e5, P16 from e10 -->
<polyline points="130,100 150,100 150,40 290,40" fill="none" stroke="#8e44ad" stroke-width="3"/>
<circle cx="130" cy="100" r="4" fill="#8e44ad"/>
<polyline points="130,150 290,150" fill="none" stroke="#16a085" stroke-width="3"/>
<circle cx="130" cy="150" r="4" fill="#16a085"/>

<!-- sensor VCC / GND -->
<polyline points="64,400 5,400" fill="none" stroke="#e33" stroke-width="3"/>
<circle cx="64" cy="400" r="4" fill="#e33"/>
<polyline points="50,420 5,420" fill="none" stroke="#111" stroke-width="3"/>
<circle cx="50" cy="420" r="4" fill="#111"/>
<text x="8" y="394" font-size="10" fill="#222">VCC</text>
<text x="8" y="436" font-size="10" fill="#222">GND</text>

<g font-size="13" fill="#222">
<text x="320" y="70" font-weight="bold">UNPLUG the charger and the laptop USB first.</text>

<text x="320" y="104" font-weight="bold">A. Divider (left half, columns a–e)</text>
<text x="330" y="124">R1 (1k): c5 → c10</text>
<text x="330" y="142">R2 (1k): b10 → b15</text>
<text x="330" y="160">R3 (1k): c15 → c20</text>
<text x="330" y="178">Short jumper: a20 → LEFT − rail</text>

<text x="320" y="214" font-weight="bold">B. Ultrasonic sensor (4 jumpers)</text>
<text x="330" y="234">VCC  → LEFT + rail (5V)</text>
<text x="330" y="252">GND  → LEFT − rail</text>
<text x="330" y="270"><tspan fill="#8e44ad" font-weight="bold">ECHO</tspan> → e5   (female-to-male jumper)</text>
<text x="330" y="288">TRIG → ESP32 P17 directly (female-to-female)</text>

<text x="320" y="324" font-weight="bold">C. ESP32</text>
<text x="330" y="344"><tspan fill="#16a085" font-weight="bold">P16</tspan> → e10   (female-to-male jumper)</text>

<text x="320" y="380" font-weight="bold">Why the divider?</text>
<text x="330" y="400">ECHO sends 5V; the ESP32 only takes 3.3V.</text>
<text x="330" y="418">R1 + (R2+R3) cut it to about 3.3V at row 10.</text>

<text x="320" y="454" font-weight="bold">Check before power-on (Ω 200 or 2000):</text>
<text x="330" y="474">• e5 ↔ e10 → about 1000 (use the 2000 range)</text>
<text x="330" y="492">• e10 ↔ LEFT − rail → about 2000 (use the 20k range)</text>
<text x="330" y="510">• LEFT + ↔ LEFT − → still OL</text>
</g>
</svg>
