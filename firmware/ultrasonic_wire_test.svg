<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Wire test: does each wire connect from the sensor to the breadboard end?</text>

<!-- multimeter -->
<rect x="400" y="60" width="200" height="150" rx="12" fill="#f2c200" stroke="#a88600" stroke-width="2"/>
<rect x="420" y="76" width="160" height="46" rx="4" fill="#cfd8c4" stroke="#555"/>
<text x="500" y="108" font-size="24" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold">0.8</text>
<circle cx="500" cy="165" r="26" fill="#333"/>
<line x1="500" y1="165" x2="478" y2="146" stroke="#fff" stroke-width="4"/>
<text x="452" y="140" font-size="11" font-weight="bold">Ω 200</text>
<text x="500" y="230" font-size="12" text-anchor="middle" font-weight="bold">Everything UNPLUGGED (charger + USB)</text>

<!-- sensor board back -->
<rect x="40" y="280" width="220" height="200" rx="8" fill="#2d6fd1"/>
<text x="150" y="500" font-size="12" text-anchor="middle">sensor board (back side)</text>
<g fill="#d4af37" stroke="#8a6d00"><circle cx="220" cy="320" r="8"/><circle cx="220" cy="360" r="8"/><circle cx="220" cy="400" r="8"/><circle cx="220" cy="440" r="8"/></g>
<g font-size="13" fill="#fff" font-weight="bold" text-anchor="end">
<text x="204" y="325">Gnd</text><text x="204" y="365">Echo</text><text x="204" y="405">Trig</text><text x="204" y="445">Vcc</text>
</g>

<!-- wires through joints -->
<g stroke-width="4" fill="none">
<polyline points="228,360 760,360" stroke="#8e44ad"/>
<polyline points="228,400 760,400" stroke="#27ae60"/>
</g>
<g fill="#333" opacity="0.85">
<rect x="320" y="345" width="26" height="70" rx="3"/><rect x="390" y="345" width="26" height="70" rx="3"/><rect x="460" y="345" width="26" height="70" rx="3"/><rect x="530" y="345" width="26" height="70" rx="3"/><rect x="600" y="345" width="26" height="70" rx="3"/>
</g>
<text x="473" y="440" font-size="11" text-anchor="middle" fill="#555">the 5 taped joints (leave them as they are)</text>
<!-- male pins (pulled out of the breadboard) -->
<rect x="760" y="352" width="30" height="16" fill="#222"/><rect x="790" y="357" width="22" height="6" fill="#bbb"/>
<rect x="760" y="392" width="30" height="16" fill="#222"/><rect x="790" y="397" width="22" height="6" fill="#bbb"/>
<text x="820" y="365" font-size="12" font-weight="bold" fill="#8e44ad">purple end</text>
<text x="820" y="405" font-size="12" font-weight="bold" fill="#27ae60">green end</text>
<text x="820" y="380" font-size="10" fill="#555">(pulled out of a5)</text>
<text x="820" y="420" font-size="10" fill="#555">(pulled out of f11)</text>

<!-- TEST 1 probes: Trig blob + green pin -->
<polyline points="220,400 220,250 420,250 440,210" fill="none" stroke="#e33" stroke-width="3"/>
<circle cx="220" cy="400" r="12" fill="none" stroke="#e33" stroke-width="3"/>
<polyline points="812,400 860,400 860,250 580,250 560,210" fill="none" stroke="#111" stroke-width="3"/>
<circle cx="806" cy="400" r="12" fill="none" stroke="#111" stroke-width="3"/>
<text x="230" y="244" font-size="12" font-weight="bold" fill="#e33">probe 1 → Trig blob</text>
<text x="640" y="244" font-size="12" font-weight="bold">probe 2 → green pin</text>

<!-- instructions -->
<g font-size="13" fill="#222">
<text x="40" y="70" font-weight="bold">TEST 1: Trig wire (drawn)</text>
<text x="52" y="90">1. Pull the green end out of f11.</text>
<text x="52" y="108">2. Probe 1 on the Trig solder blob.</text>
<text x="52" y="126">3. Probe 2 on the green metal pin.</text>
<text x="52" y="144">4. Near 0 → good. Plug green back in f11.</text>

<text x="40" y="180" font-weight="bold">TEST 2: Echo wire (same way)</text>
<text x="52" y="200">Echo blob ↔ purple pin (pulled out of a5).</text>

<text x="660" y="70" font-weight="bold">Reading</text>
<text x="672" y="90"><tspan font-weight="bold" fill="#2a9d3a">0.3 – 2</tspan>  = connected ✓</text>
<text x="672" y="110"><tspan font-weight="bold" fill="#c0392b">OL</tspan> (or "1")  = broken: a joint is loose</text>
<text x="672" y="138">Red/black probe order doesn't matter.</text>
</g>
<text x="40" y="540" font-size="12" fill="#555">Put each wire back after its test: green → f11, purple → a5.</text>
</svg>
