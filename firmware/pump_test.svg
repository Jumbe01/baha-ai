<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
<rect width="1000" height="600" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Pump not pumping: test it alone, then check K1</text>

<!-- ===== STEP 1 ===== -->
<text x="40" y="66" font-size="14" font-weight="bold">STEP 1: pump straight on the rails (charger ON)</text>
<rect x="40" y="80" width="70" height="230" fill="#f4f4f0" stroke="#bbb"/>
<line x1="62" y1="86" x2="62" y2="304" stroke="#3a7bd5" stroke-width="3"/>
<line x1="88" y1="86" x2="88" y2="304" stroke="#e33" stroke-width="3"/>
<g font-size="12" font-weight="bold" text-anchor="middle"><text x="62" y="78" fill="#3a7bd5">−</text><text x="88" y="78" fill="#e33">+</text></g>
<text x="75" y="326" font-size="10" text-anchor="middle" fill="#555">right rails</text>

<!-- cup with pump -->
<path d="M260,170 L270,300 L370,300 L380,170 Z" fill="#d9ecfa" stroke="#555" stroke-width="2"/>
<rect x="268" y="200" width="104" height="98" fill="#7fb8e6" opacity="0.7"/>
<rect x="295" y="250" width="50" height="40" rx="5" fill="#555"/>
<text x="320" y="275" font-size="10" fill="#fff" text-anchor="middle">PUMP</text>
<text x="320" y="320" font-size="11" text-anchor="middle">fully UNDER water</text>

<polyline points="88,150 200,150 200,262 295,262" fill="none" stroke="#c0392b" stroke-width="4"/>
<polyline points="62,190 180,190 180,282 295,282" fill="none" stroke="#111" stroke-width="4"/>
<circle cx="88" cy="150" r="5" fill="#c0392b"/><circle cx="62" cy="190" r="5" fill="#111"/>
<g font-size="12" font-weight="bold">
<text x="96" y="142" fill="#c0392b">red → + rail (taken off K1)</text>
<text x="96" y="210">black → − r41 (as it is)</text>
</g>
<g font-size="12.5" fill="#222">
<text x="420" y="160"><tspan font-weight="bold" fill="#2a9d3a">Pumps</tspan> → pump is fine. Go to STEP 2.</text>
<text x="420" y="184"><tspan font-weight="bold" fill="#c0392b">Nothing</tspan> → black wire not touching metal in the rail</text>
<text x="434" y="202">(re-wrap a taped bare end), or pump not fully under water.</text>
<text x="420" y="230">It may only hum/vibrate for the first second: that's OK.</text>
</g>

<line x1="20" y1="345" x2="980" y2="345" stroke="#ddd"/>

<!-- ===== STEP 2 ===== -->
<text x="40" y="376" font-size="14" font-weight="bold">STEP 2: put red back on K1 and check the screws (UNPLUG first)</text>
<rect x="420" y="390" width="160" height="190" rx="8" fill="#2d6fd1"/>
<g fill="#ddd" stroke="#555" stroke-width="1.5">
<circle cx="410" cy="410" r="9"/><circle cx="410" cy="434" r="9"/><circle cx="410" cy="458" r="9"/>
<circle cx="410" cy="500" r="9"/><circle cx="410" cy="524" r="9"/><circle cx="410" cy="548" r="9"/>
</g>
<g font-size="11" fill="#fff"><text x="426" y="414">NO</text><text x="426" y="438">COM</text><text x="426" y="462">NC</text><text x="426" y="504">NO</text><text x="426" y="528">COM</text><text x="426" y="552">NC</text></g>
<g font-size="13" fill="#fff" font-weight="bold"><text x="540" y="438">K2</text><text x="540" y="528">K1</text></g>
<text x="500" y="575" font-size="10" fill="#dfe8ff" text-anchor="middle">(K4, K3 above: empty)</text>

<!-- K2 COM feed + link -->
<polyline points="88,434 401,434" fill="none" stroke="#e33" stroke-width="4"/>
<text x="110" y="426" font-size="12" font-weight="bold" fill="#e33">+ r40 → K2 COM (siren works, so this is OK)</text>
<polyline points="401,434 370,434 370,524 401,524" fill="none" stroke="#e33" stroke-width="5"/>
<circle cx="370" cy="480" r="16" fill="none" stroke="#ffb000" stroke-width="3"/>
<text x="180" y="484" font-size="13" font-weight="bold" fill="#c77c00">LINK K2 COM → K1 COM</text>
<text x="180" y="500" font-size="11" fill="#c77c00">missing = no power to the pump</text>

<!-- pump red on K1 NO -->
<polyline points="419,500 640,500" fill="none" stroke="#c0392b" stroke-width="4"/>
<text x="610" y="492" font-size="12" font-weight="bold" fill="#c0392b">pump red → K1 NO (top screw)</text>

<g font-size="12.5" fill="#222">
<text x="680" y="420" font-weight="bold">Check</text>
<text x="692" y="440">• K1 = the BOTTOM group.</text>
<text x="692" y="458">• Link wire in K1's MIDDLE screw.</text>
<text x="692" y="476">• Tug each wire: the screw must</text>
<text x="706" y="494">bite bare metal, not insulation.</text>
<text x="692" y="530">Then gate7_relay: pump runs</text>
<text x="706" y="548">on "IN1 pump ON".</text>
</g>
</svg>
