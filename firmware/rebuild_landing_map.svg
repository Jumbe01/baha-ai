<g font-size="9.5">
<text x="445" y="133">relay VCC → + r5</text>
<text x="445" y="145">relay GND → − r6</text>
<text x="445" y="157" fill="#16a085" font-weight="bold">relay IN4 → e7</text>
<text x="445" y="193" fill="#16a085" font-weight="bold">relay IN3 → e10</text>
<text x="445" y="205" fill="#16a085" font-weight="bold">relay IN2 → e11</text>
<text x="445" y="217" fill="#16a085" font-weight="bold">relay IN1 → e12</text>
<text x="445" y="229" fill="#d35400" font-weight="bold">servo orange → e13</text>
<text x="445" y="241" fill="#2980b9" font-weight="bold">rain pin 1 → e14</text>
<text x="445" y="253" fill="#27ae60" font-weight="bold">DHT22 out → e15</text>
<text x="445" y="318" fill="#c77c00" font-weight="bold">rain pin 2 → i21</text>
<text x="445" y="331" fill="#c77c00" font-weight="bold">DHT22 + → j21</text>
<text x="445" y="433">servo red → + r30</text>
<text x="445" y="445">servo brown → − r31</text>
<text x="445" y="457">DHT22 − → − r32</text>
<text x="445" y="553">relay K2 COM ← + r40</text>
<text x="445" y="565">pump black → − r41</text>
<text x="445" y="577">siren black → − r42</text>
</g>

<!-- instructions -->
<g font-size="12.5" fill="#222">
<text x="610" y="70" font-weight="bold">Board wires (MALE–MALE): check each one</text>
<text x="622" y="90"><tspan font-weight="bold">A</tspan>   e8 → right − rail (inner, blue)  <tspan fill="#c0392b">MOVED from e9</tspan></text>
<text x="622" y="108"><tspan font-weight="bold">B</tspan>   left + ↔ right +, row 57</text>
<text x="622" y="126"><tspan font-weight="bold">C</tspan>   left − ↔ right −, row 60</text>
<text x="622" y="144"><tspan font-weight="bold">D1</tspan>  a20 → left − rail (outer, blue)</text>
<text x="622" y="162"><tspan font-weight="bold">D2</tspan>  e10 → f10  (straight across the gap)</text>
<text x="622" y="180"><tspan font-weight="bold">E1</tspan>  e21 → f21  <tspan fill="#c0392b">MOVED from e22</tspan></text>

<text x="610" y="214" font-weight="bold">Checks (Ω 200, unplugged)</text>
<text x="622" y="232">• silver cover ↔ right − rail → near 0 (wire A)</text>
<text x="622" y="250">• silver cover ↔ left − rail → near 0 (B/C bridges)</text>
<text x="622" y="268">• d10 ↔ P16 pin (left, 8th) → near 0 (D2)</text>
<text x="622" y="286">• g21 ↔ ESP32 3V3 pin (right, last) → near 0 (E1)</text>

<text x="610" y="320" font-weight="bold">Later, in the box: module wires</text>
<text x="622" y="338">Each label = which hole that wire lands in.</text>
<text x="622" y="356">"+ r5" = + rail, row 5.  "− r6" = − rail, row 6.</text>
<text x="622" y="374">Right board: − rail INNER (blue), + OUTER (red).</text>
<text x="622" y="392">Left board:  − rail OUTER (blue), + INNER (red).</text>

<text x="610" y="426" font-weight="bold">Wire types</text>
<text x="622" y="444">Sensor / relay / DHT / rain pins → board: FEMALE–MALE</text>
<text x="622" y="462">Servo plug → board: MALE–MALE</text>
<text x="622" y="480">Board → relay screw terminal: MALE–MALE</text>

<text x="610" y="514" font-weight="bold">Relay screw terminals (unchanged)</text>
<text x="622" y="532">K2 COM ← + r40,  short wire K2 COM → K1 COM</text>
<text x="622" y="550">K2 NO → siren red,  K1 NO → pump red</text>

<text x="610" y="586" font-weight="bold" fill="#c0392b">✗ = leave EMPTY: 5V (row 3) and P12 (row 9).</text>
<text x="610" y="606" fill="#c0392b">P12 must never be connected; it can stop the ESP32 from booting.</text>
<text x="610" y="636" font-weight="bold">The DHT22 is on P32 (row 15). The code is already updated.</text>
</g>
</svg>
