<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
<rect width="1000" height="600" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">DHT22 + rain plate: right board (zoomed, rows 12–33)</text>

<!-- right board; y = 60 + (r-12)*22 -->
<rect x="40" y="50" width="330" height="500" fill="#f4f4f0" stroke="#bbb"/>
<rect x="180" y="56" width="26" height="488" fill="#e8e8e2"/>
<line x1="320" y1="56" x2="320" y2="544" stroke="#3a7bd5" stroke-width="3"/>
<line x1="345" y1="56" x2="345" y2="544" stroke="#e33" stroke-width="3"/>
<g font-size="13" font-weight="bold" text-anchor="middle"><text x="320" y="46" fill="#3a7bd5">−</text><text x="345" y="46" fill="#e33">+</text></g>
<g font-size="11" fill="#555" text-anchor="middle">
<text x="70" y="46">a</text><text x="95" y="46">b</text><text x="120" y="46">c</text><text x="145" y="46">d</text><text x="170" y="46">e</text>
<text x="215" y="46">f</text><text x="235" y="46">g</text><text x="255" y="46">h</text><text x="275" y="46">i</text><text x="295" y="46">j</text>
</g>
<g font-size="12" fill="#555" text-anchor="end" font-weight="bold">
<text x="34" y="64">12</text><text x="34" y="86">13</text><text x="34" y="108">14</text><text x="34" y="130">15</text><text x="34" y="262">21</text><text x="34" y="526">33</text><text x="34" y="504">32</text>
</g>

<!-- ESP32 edge rows 12-21, pins in column d -->
<rect x="40" y="50" width="115" height="226" fill="#222"/>
<g fill="#d4af37"><circle cx="145" cy="60" r="5"/><circle cx="145" cy="82" r="5"/><circle cx="145" cy="104" r="5"/><circle cx="145" cy="126" r="5"/><circle cx="145" cy="258" r="5"/></g>
<g font-size="11" fill="#fff" text-anchor="end">
<text x="132" y="64">P26</text><text x="132" y="86">P25</text><text x="132" y="108" fill="#ffd166" font-weight="bold">P33</text><text x="132" y="130" fill="#ffd166" font-weight="bold">P32</text><text x="132" y="262" fill="#ffd166" font-weight="bold">3V3</text>
</g>

<!-- already in: relay IN1 e12, servo e13, E1 e21->f21 -->
<polyline points="170,60 380,60" fill="none" stroke="#27ae60" stroke-width="3" opacity="0.4"/>
<polyline points="170,82 380,82" fill="none" stroke="#d35400" stroke-width="3" opacity="0.4"/>
<text x="385" y="64" font-size="10" fill="#888">relay IN1 (in)</text><text x="385" y="86" font-size="10" fill="#888">servo (in)</text>
<polyline points="170,258 215,258" fill="none" stroke="#f39c12" stroke-width="4"/>
<text x="176" y="250" font-size="10" font-weight="bold" fill="#c77c00">E1 (in)</text>

<!-- DHT22 module -->
<rect x="760" y="80" width="90" height="120" rx="6" fill="#f5f5f5" stroke="#999"/>
<g stroke="#ccc"><line x1="770" y1="100" x2="840" y2="100"/><line x1="770" y1="115" x2="840" y2="115"/><line x1="770" y1="130" x2="840" y2="130"/><line x1="770" y1="145" x2="840" y2="145"/></g>
<text x="805" y="72" font-size="13" text-anchor="middle" font-weight="bold">DHT22</text>
<g fill="#bbb" stroke="#555"><rect x="770" y="200" width="12" height="14"/><rect x="799" y="200" width="12" height="14"/><rect x="828" y="200" width="12" height="14"/></g>
<g font-size="12" font-weight="bold" text-anchor="middle"><text x="776" y="232">−</text><text x="805" y="232">out</text><text x="834" y="232">+</text></g>

<!-- DHT wires -->
<polyline points="805,214 805,250 520,250 520,126 170,126" fill="none" stroke="#27ae60" stroke-width="4"/>
<polyline points="834,214 834,262 295,262" fill="none" stroke="#f39c12" stroke-width="4"/>
<polyline points="776,214 776,240 700,240 700,500 320,500" fill="none" stroke="#111" stroke-width="4"/>
<circle cx="170" cy="126" r="6" fill="#27ae60"/><circle cx="295" cy="262" r="6" fill="#f39c12"/><circle cx="320" cy="500" r="6" fill="#111"/>
<g font-size="12" font-weight="bold">
<text x="380" y="120" fill="#27ae60">DHT out → e15</text>
<text x="380" y="280" fill="#c77c00">DHT + → j21</text>
<text x="380" y="494">DHT − → − r32</text>
</g>

<!-- rain plate -->
<rect x="720" y="330" width="120" height="80" rx="4" fill="#d24c3c"/>
<g stroke="#e8c070" stroke-width="3"><line x1="730" y1="345" x2="830" y2="345"/><line x1="730" y1="360" x2="830" y2="360"/><line x1="730" y1="375" x2="830" y2="375"/><line x1="730" y1="390" x2="830" y2="390"/></g>
<text x="780" y="322" font-size="13" text-anchor="middle" font-weight="bold">RAIN PLATE</text>
<g fill="#bbb" stroke="#555"><rect x="845" y="352" width="14" height="10"/><rect x="845" y="378" width="14" height="10"/></g>
<text x="866" y="361" font-size="11">pin 1</text><text x="866" y="387" font-size="11">pin 2</text>
<polyline points="859,357 900,357 900,300 535,300 535,104 170,104" fill="none" stroke="#2980b9" stroke-width="4"/>
<polyline points="859,383 915,383 915,430 600,430 600,269 275,269" fill="none" stroke="#e67e22" stroke-width="4"/>
<circle cx="170" cy="104" r="6" fill="#2980b9"/><circle cx="275" cy="269" r="6" fill="#e67e22"/>
<g font-size="12" font-weight="bold">
<text x="380" y="98" fill="#2980b9">rain pin 1 → e14</text>
<text x="610" y="424" fill="#e67e22">rain pin 2 → i21</text>
</g>

<!-- notes -->
<g font-size="12.5" fill="#222">
<text x="420" y="530" font-weight="bold">Wire type: FEMALE–MALE (female on the module pins).</text>
<text x="420" y="548">Right board: − rail = INNER (blue). i21 and j21 are 3V3 (through E1).</text>
<text x="420" y="572" font-weight="bold">Test: upload gate3_dht22 (now on P32) → temperature and humidity lines.</text>
<text x="420" y="590">Rain plate: tested later with baha_node (rain %).</text>
</g>
</svg>
