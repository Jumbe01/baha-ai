<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, sans-serif">
<defs>
  <pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" x="85" y="55">
    <rect x="3" y="3" width="4" height="4" fill="#999"/>
  </pattern>
  <pattern id="r" width="14" height="10" patternUnits="userSpaceOnUse" x="43" y="55">
    <rect x="5" y="3" width="4" height="4" fill="#999"/>
  </pattern>
</defs>
<rect width="900" height="700" fill="#fff"/>
<text x="20" y="24" font-size="15" font-weight="bold">Breadboard Step 4: Relay board (control side only)</text>

<!-- breadboard body -->
<rect x="30" y="40" width="234" height="630" rx="6" fill="#f4f4f0" stroke="#ccc"/>
<rect x="43" y="55" width="28" height="600" fill="url(#r)"/>
<rect x="219" y="55" width="28" height="600" fill="url(#r)"/>
<rect x="85" y="55" width="50" height="600" fill="url(#h)"/>
<rect x="155" y="55" width="50" height="600" fill="url(#h)"/>
<line x1="44" y1="50" x2="44" y2="660" stroke="#3a7bd5"/><line x1="70" y1="50" x2="70" y2="660" stroke="#e33"/>
<line x1="220" y1="50" x2="220" y2="660" stroke="#3a7bd5"/><line x1="246" y1="50" x2="246" y2="660" stroke="#e33"/>
<g font-size="11" font-weight="bold" text-anchor="middle">
<text x="50" y="48" fill="#3a7bd5">−</text><text x="64" y="48" fill="#e33">+</text>
<text x="226" y="48" fill="#3a7bd5">−</text><text x="240" y="48" fill="#e33">+</text>
</g>
<g font-size="9" fill="#555" text-anchor="middle">
<text x="90" y="52">a</text><text x="100" y="52">b</text><text x="110" y="52">c</text><text x="120" y="52">d</text><text x="130" y="52">e</text>
<text x="160" y="52">f</text><text x="170" y="52">g</text><text x="180" y="52">h</text><text x="190" y="52">i</text><text x="200" y="52">j</text>
<text x="145" y="64">1</text><text x="145" y="164">11</text><text x="145" y="264">21</text><text x="145" y="364">31</text><text x="145" y="464">41</text><text x="145" y="564">51</text><text x="145" y="654">60</text>
</g>
<text x="147" y="690" font-size="10" fill="#555" text-anchor="middle">LEFT = 5V  |  RIGHT = 3V3</text>

<g opacity="0.3">
<polyline points="5,90 64,90 64,70" fill="none" stroke="#e33" stroke-width="3"/>
<polyline points="5,100 50,100 50,70" fill="none" stroke="#2a9d3a" stroke-width="3"/>
<polyline points="50,650 50,664 226,664 226,650" fill="none" stroke="#e6c200" stroke-width="3"/>
<line x1="110" y1="100" x2="110" y2="150" stroke="#777" stroke-width="2"/>
<line x1="100" y1="150" x2="100" y2="200" stroke="#777" stroke-width="2"/>
<line x1="110" y1="200" x2="110" y2="250" stroke="#777" stroke-width="2"/>
<polyline points="290,70 240,70" fill="none" stroke="#f39c12" stroke-width="3"/>
<rect x="223" y="82" width="20" height="18" rx="3" fill="#222"/>
</g>

<!-- relay ribbon male ends into a30-a33 -->
<g stroke-width="3" fill="none">
<polyline points="5,350 90,350" stroke="#8e44ad"/>
<polyline points="5,360 90,360" stroke="#2980b9"/>
<polyline points="5,370 90,370" stroke="#16a085"/>
<polyline points="5,380 90,380" stroke="#d35400"/>
</g>
<g fill="#222"><circle cx="90" cy="350" r="3.5"/><circle cx="90" cy="360" r="3.5"/><circle cx="90" cy="370" r="3.5"/><circle cx="90" cy="380" r="3.5"/></g>
<!-- ESP32 jumpers into e30-e33 -->
<g stroke="#444" stroke-width="2" stroke-dasharray="4 3" fill="none">
<polyline points="130,350 150,350 150,330 205,330"/>
<polyline points="130,360 160,360 160,340 205,340"/>
<polyline points="130,370 170,370 170,385 205,385"/>
<polyline points="130,380 180,380 180,395 205,395"/>
</g>
<g fill="#222"><circle cx="130" cy="350" r="3.5"/><circle cx="130" cy="360" r="3.5"/><circle cx="130" cy="370" r="3.5"/><circle cx="130" cy="380" r="3.5"/></g>
<g font-size="9" fill="#222">
<text x="10" y="346">IN1</text><text x="10" y="366">IN2</text><text x="40" y="366">IN3</text><text x="10" y="392">IN4</text>
</g>

<!-- relay VCC/GND -->
<polyline points="64,420 5,420" fill="none" stroke="#e33" stroke-width="3"/>
<polyline points="50,440 5,440" fill="none" stroke="#111" stroke-width="3"/>
<circle cx="64" cy="420" r="4" fill="#e33"/><circle cx="50" cy="440" r="4" fill="#111"/>
<text x="10" y="414" font-size="9" fill="#222">VCC</text><text x="10" y="454" font-size="9" fill="#222">GND</text>

<g font-size="13" fill="#222">
<text x="320" y="70" font-weight="bold">UNPLUG the laptop USB and the charger first.</text>
<text x="320" y="92">Nothing on the screw terminals yet — pump/siren are Step 5.</text>

<text x="320" y="126" font-weight="bold">A. Relay ribbon → breadboard (male ends)</text>
<text x="330" y="146">VCC → LEFT + rail</text>
<text x="330" y="164">GND → LEFT − rail</text>
<text x="330" y="182">IN1 → a30</text>
<text x="330" y="200">IN2 → a31</text>
<text x="330" y="218">IN3 → a32</text>
<text x="330" y="236">IN4 → a33</text>

<text x="320" y="272" font-weight="bold">B. ESP32 → breadboard (female-to-male jumpers)</text>
<text x="330" y="292">P26 → e30   (IN1, pump)</text>
<text x="330" y="310">P27 → e31   (IN2, siren)</text>
<text x="330" y="328">P14 → e32   (IN3, floodgate)</text>
<text x="330" y="346">P13 → e33   (IN4, spare)</text>

<text x="320" y="382" font-weight="bold">Keep the yellow JD-VCC jumper on the relay board ON.</text>

<text x="320" y="418" font-weight="bold">Check before power-on (Ω 200):</text>
<text x="330" y="438">• LEFT + ↔ LEFT − → not close to 0</text>
<text x="330" y="456">• a30 ↔ a31 → OL (rows not touching)</text>

<text x="320" y="492" font-weight="bold">Test: upload gate7_relay</text>
<text x="330" y="512">Each relay clicks + its LED lights for 1 s, in order 1→4.</text>
<text x="330" y="530">Then upload baha_sensor_node again.</text>
</g>
</svg>
