<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" font-family="Arial, sans-serif">
<defs>
  <pattern id="holes" x="46" y="46" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="6" cy="6" r="2" fill="#c9b27a"/>
  </pattern>
</defs>
<rect width="760" height="700" fill="#ffffff"/>
<text x="40" y="22" font-size="14" font-weight="bold">BahaAI perfboard (tan-aw gikan sa IBABAW, bahin sa parts)</text>

<!-- board -->
<rect x="40" y="40" width="384" height="636" rx="6" fill="#1f7a4a"/>
<rect x="46" y="46" width="372" height="624" fill="url(#holes)"/>
<line x1="40" y1="358" x2="424" y2="358" stroke="#a8e0c0" stroke-width="1" stroke-dasharray="4 3"/>
<text x="430" y="362" font-size="10" fill="#555">linya sa tunga (ayaw putla)</text>

<!-- row labels -->
<g font-size="8" fill="#444" text-anchor="middle">
<text x="32" y="55">A</text><text x="32" y="115">F</text><text x="32" y="175">K</text><text x="32" y="235">P</text><text x="32" y="295">U</text><text x="32" y="355">Z</text>
<text x="32" y="367">A</text><text x="32" y="427">F</text><text x="32" y="451">H</text><text x="32" y="487">K</text><text x="32" y="547">P</text><text x="32" y="607">U</text><text x="32" y="667">Z</text>
</g>
<g font-size="8" fill="#444" text-anchor="middle">
<text x="52" y="36">1</text><text x="100" y="36">5</text><text x="160" y="36">10</text><text x="220" y="36">15</text><text x="280" y="36">20</text><text x="340" y="36">25</text><text x="400" y="36">30</text>
</g>

<!-- buses -->
<line x1="52" y1="232" x2="400" y2="232" stroke="#ff3b30" stroke-width="3"/>
<line x1="52" y1="256" x2="400" y2="256" stroke="#111" stroke-width="3"/>
<line x1="100" y1="280" x2="208" y2="280" stroke="#ff9500" stroke-width="3"/>

<!-- J1 / J2 / cap -->
<rect x="44" y="224" width="16" height="40" fill="#3a7bd5" stroke="#fff"/>
<text x="44" y="218" font-size="10" fill="#fff" font-weight="bold">J1</text>
<rect x="392" y="224" width="16" height="40" fill="#3a7bd5" stroke="#fff"/>
<text x="392" y="218" font-size="10" fill="#fff" font-weight="bold">J2</text>
<rect x="84" y="236" width="8" height="16" fill="#222" stroke="#fff"/>
<text x="94" y="248" font-size="9" fill="#fff">C</text>

<!-- left vertical power feeds -->
<line x1="64" y1="232" x2="64" y2="664" stroke="#ff3b30" stroke-width="2"/>
<line x1="76" y1="256" x2="76" y2="604" stroke="#111" stroke-width="2"/>
<!-- right GND feed for divider -->
<line x1="388" y1="256" x2="388" y2="508" stroke="#111" stroke-width="2"/>

<!-- sensor headers (male) -->
<rect x="82" y="310" width="48" height="12" fill="#222" stroke="#fff"/>
<rect x="202" y="310" width="36" height="12" fill="#222" stroke="#fff"/>
<rect x="310" y="310" width="48" height="12" fill="#222" stroke="#fff"/>
<text x="82" y="306" font-size="9" fill="#fff">RAIN</text>
<text x="202" y="306" font-size="9" fill="#fff">DHT22</text>
<text x="310" y="306" font-size="9" fill="#fff">ULTRA</text>

<!-- sensor power stubs -->
<line x1="88" y1="310" x2="88" y2="256" stroke="#111" stroke-width="2"/>
<line x1="100" y1="310" x2="100" y2="280" stroke="#ff9500" stroke-width="2"/>
<line x1="208" y1="310" x2="208" y2="280" stroke="#ff9500" stroke-width="2"/>
<line x1="232" y1="310" x2="232" y2="256" stroke="#111" stroke-width="2"/>
<line x1="316" y1="310" x2="316" y2="232" stroke="#ff3b30" stroke-width="2"/>
<line x1="352" y1="310" x2="352" y2="256" stroke="#111" stroke-width="2"/>

<!-- ESP32 socket -->
<rect x="178" y="436" width="96" height="236" fill="none" stroke="#fff" stroke-dasharray="5 4"/>
<rect x="166" y="442" width="12" height="228" fill="#7b2cbf" stroke="#fff"/>
<rect x="274" y="442" width="12" height="228" fill="#7b2cbf" stroke="#fff"/>
<text x="220" y="470" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">ESP32</text>
<text x="220" y="660" font-size="9" fill="#fff" text-anchor="middle">USB dinhi (ubos)</text>
<g font-size="8" fill="#fff">
<text x="182" y="451">3V3</text><text x="182" y="511">P35</text><text x="182" y="535">P33</text><text x="182" y="547">P25</text>
<text x="182" y="559">P26</text><text x="182" y="571">P27</text><text x="182" y="583">P14</text><text x="182" y="619">P13</text>
<text x="182" y="667">5V x</text>
</g>
<g font-size="8" fill="#fff" text-anchor="end">
<text x="270" y="451">GND</text><text x="270" y="571">P17</text><text x="270" y="583">P16</text><text x="270" y="595">P4</text>
</g>
<line x1="172" y1="448" x2="172" y2="280" stroke="#ff9500" stroke-width="2"/>
<line x1="280" y1="448" x2="280" y2="256" stroke="#111" stroke-width="2"/>

<!-- servo + relay headers (male) -->
<rect x="82" y="514" width="12" height="36" fill="#222" stroke="#fff"/>
<rect x="82" y="598" width="12" height="72" fill="#7b2cbf" stroke="#fff"/>
<text x="98" y="512" font-size="9" fill="#fff">SERVO</text>
<text x="44" y="596" font-size="9" fill="#fff">RELAY</text>
<line x1="88" y1="520" x2="76" y2="520" stroke="#111" stroke-width="2"/>
<line x1="88" y1="532" x2="64" y2="532" stroke="#ff3b30" stroke-width="2"/>
<line x1="88" y1="604" x2="76" y2="604" stroke="#111" stroke-width="2"/>
<line x1="88" y1="664" x2="64" y2="664" stroke="#ff3b30" stroke-width="2"/>

<!-- signal wires (yellow) -->
<g stroke="#ffd60a" stroke-width="2" fill="none">
<polyline points="112,322 112,532 166,532"/>
<polyline points="124,322 124,508 166,508"/>
<polyline points="166,544 94,544"/>
<polyline points="166,556 112,556 112,616 94,616"/>
<polyline points="166,568 124,568 124,628 94,628"/>
<polyline points="166,580 136,580 136,640 94,640"/>
<polyline points="166,616 148,616 148,652 94,652"/>
<polyline points="328,322 328,568 286,568"/>
<polyline points="340,322 340,364"/>
<polyline points="340,400 340,580 286,580"/>
<polyline points="340,412 364,412"/>
<polyline points="364,496 364,508 388,508"/>
<polyline points="220,322 220,592 274,592" stroke-dasharray="5 3"/>
</g>

<!-- resistors -->
<rect x="335" y="364" width="10" height="36" fill="#e9c46a" stroke="#fff"/>
<rect x="359" y="412" width="10" height="36" fill="#e9c46a" stroke="#fff"/>
<rect x="359" y="460" width="10" height="36" fill="#e9c46a" stroke="#fff"/>
<line x1="364" y1="448" x2="364" y2="460" stroke="#ffd60a" stroke-width="2"/>
<text x="318" y="386" font-size="9" fill="#fff">R1</text>
<text x="372" y="434" font-size="9" fill="#fff">R2</text>
<text x="372" y="482" font-size="9" fill="#fff">R3</text>

<!-- legend / table -->
<g font-size="11" fill="#222">
<text x="450" y="70" font-weight="bold">Kolor</text>
<line x1="450" y1="86" x2="474" y2="86" stroke="#ff3b30" stroke-width="3"/><text x="480" y="90">5V bus (laray P sa ibabaw nga tunga)</text>
<line x1="450" y1="104" x2="474" y2="104" stroke="#111" stroke-width="3"/><text x="480" y="108">GND bus (laray R)</text>
<line x1="450" y1="122" x2="474" y2="122" stroke="#ff9500" stroke-width="3"/><text x="480" y="126">3V3 bus (laray T)</text>
<line x1="450" y1="140" x2="474" y2="140" stroke="#ffd60a" stroke-width="3"/><text x="480" y="144">signal</text>
<line x1="450" y1="158" x2="474" y2="158" stroke="#ffd60a" stroke-width="3" stroke-dasharray="5 3"/><text x="480" y="162">signal, agi sa ilalom sa ESP32</text>

<text x="450" y="196" font-weight="bold">Mga header (wala → tuo / ibabaw → ubos)</text>
<text x="450" y="214">RAIN: GND, VCC, DO, AO</text>
<text x="450" y="230">DHT22: VCC, DATA, GND</text>
<text x="450" y="246">ULTRA: VCC, TRIG, ECHO, GND</text>
<text x="450" y="262">SERVO: GND, 5V, SIG</text>
<text x="450" y="278">RELAY (FEMALE): GND, IN1, IN2, IN3, IN4, VCC</text>

<text x="450" y="312" font-weight="bold">Parts</text>
<text x="450" y="330">J1 = screw terminal, power IN (+ ibabaw)</text>
<text x="450" y="346">J2 = screw terminal, 5V OUT (siren/pump)</text>
<text x="450" y="362">C = 470uF, stripe (−) sa GND</text>
<text x="450" y="378">R1 = 1k (ECHO → P16)</text>
<text x="450" y="394">R2 + R3 = 1k + 1k (P16 → GND)</text>
<text x="450" y="410">ESP32 = 2 × 19 female header</text>
<text x="450" y="426">Relay = 6-pin FEMALE (para sa ribbon)</text>
<text x="450" y="442">Uban = male header pins</text>

<text x="450" y="460" font-weight="bold">Pahinumdom</text>
<text x="450" y="478">• Ang mga wire ibutang sa LIKOD.</text>
<text x="450" y="494">• Naay panit ang wire → pwede magkrus.</text>
<text x="450" y="510">• 5V pin sa ESP32: AYAW ikonektar.</text>
<text x="450" y="526">• Dili kinahanglan putlon ang board.</text>
<text x="450" y="542">• Ang gilay-on sa ESP32 header:</text>
<text x="450" y="558">  ang ESP32 mismo ang mopili (Step 7).</text>
</g>
</svg>
