<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Relay dark: is power reaching the RELAY's own pins?</text>

<!-- relay board -->
<rect x="300" y="70" width="300" height="420" rx="10" fill="#2d6fd1"/>
<g fill="#1d4fa8"><rect x="430" y="100" width="150" height="70" rx="4"/><rect x="430" y="185" width="150" height="70" rx="4"/><rect x="430" y="270" width="150" height="70" rx="4"/><rect x="430" y="355" width="150" height="70" rx="4"/></g>
<g font-size="12" fill="#fff" font-weight="bold"><text x="500" y="140">K4</text><text x="500" y="225">K3</text><text x="500" y="310">K2</text><text x="500" y="395">K1</text></g>
<!-- channel LEDs -->
<g fill="#7a1a1a" stroke="#fff"><circle cx="380" cy="135" r="6"/><circle cx="380" cy="220" r="6"/><circle cx="380" cy="305" r="6"/><circle cx="380" cy="390" r="6"/></g>
<text x="372" y="460" font-size="11" fill="#fff">LEDs light when a relay is ON</text>

<!-- header pins -->
<g fill="#bbb" stroke="#444"><rect x="286" y="160" width="16" height="16"/><rect x="286" y="194" width="16" height="16"/><rect x="286" y="228" width="16" height="16"/><rect x="286" y="262" width="16" height="16"/><rect x="286" y="296" width="16" height="16"/><rect x="286" y="330" width="16" height="16"/></g>
<g font-size="12" fill="#fff" font-weight="bold"><text x="310" y="173">GND</text><text x="310" y="207">IN1</text><text x="310" y="241">IN2</text><text x="310" y="275">IN3</text><text x="310" y="309">IN4</text><text x="310" y="343">VCC</text></g>

<!-- JD-VCC jumper -->
<rect x="320" y="400" width="44" height="22" rx="3" fill="#111"/>
<text x="342" y="416" font-size="9" fill="#fff" text-anchor="middle">jumper</text>
<text x="312" y="396" font-size="10" fill="#fff">JD-VCC  VCC</text>
<circle cx="342" cy="411" r="30" fill="none" stroke="#ffd166" stroke-width="3"/>

<!-- ribbon wires to the left -->
<g stroke-width="4">
<line x1="160" y1="168" x2="286" y2="168" stroke="#2457c5"/>
<line x1="160" y1="202" x2="286" y2="202" stroke="#27ae60"/>
<line x1="160" y1="236" x2="286" y2="236" stroke="#e6c200"/>
<line x1="160" y1="270" x2="286" y2="270" stroke="#e67e22"/>
<line x1="160" y1="304" x2="286" y2="304" stroke="#e33"/>
<line x1="160" y1="338" x2="286" y2="338" stroke="#8b4513"/>
</g>
<text x="40" y="172" font-size="11">blue → − r6</text>
<text x="40" y="206" font-size="11">green → e12</text>
<text x="40" y="342" font-size="11">brown → + r5</text>

<!-- TEST 1 probes -->
<circle cx="294" cy="168" r="13" fill="none" stroke="#111" stroke-width="3"/>
<circle cx="294" cy="338" r="13" fill="none" stroke="#e33" stroke-width="3"/>
<text x="40" y="380" font-size="13" font-weight="bold">TEST 1 (V⎓20, charger ON)</text>
<text x="40" y="398" font-size="12">black probe on GND pin,</text>
<text x="40" y="414" font-size="12">red probe on VCC pin</text>
<text x="40" y="432" font-size="12" font-weight="bold">→ should be about 5 V</text>

<!-- instructions -->
<g font-size="13" fill="#222">
<text x="640" y="80" font-weight="bold">TEST 1 (circled black + red)</text>
<text x="652" y="100">Probes on the relay's OWN GND and VCC pins,</text>
<text x="652" y="118">not on the breadboard.</text>
<text x="652" y="140"><tspan font-weight="bold" fill="#2a9d3a">≈ 5 V</tspan> → relay has power. Check the</text>
<text x="652" y="158">yellow-circled jumper, then TEST 2.</text>
<text x="652" y="180"><tspan font-weight="bold" fill="#c0392b">≈ 0 V</tspan> → brown or blue wire isn't connecting.</text>
<text x="652" y="198">Re-push both ends (and any adapter joints)</text>
<text x="652" y="216">into + r5 and − r6.</text>

<text x="640" y="256" font-weight="bold">JUMPER (yellow circle)</text>
<text x="652" y="276">A small black cap across JD-VCC and VCC.</text>
<text x="652" y="294">Missing? Put it back over those 2 pins.</text>

<text x="640" y="334" font-weight="bold">TEST 2: does IN1 switch?</text>
<text x="652" y="354">Black probe on GND pin, red on IN1 pin.</text>
<text x="652" y="372">When Serial says "IN1 pump ON":</text>
<text x="652" y="390"><tspan font-weight="bold" fill="#2a9d3a">drops to ≈ 0 V</tspan> → signal arrives.</text>
<text x="652" y="408"><tspan font-weight="bold" fill="#c0392b">never changes</tspan> → green wire / e12 not connected.</text>

<text x="640" y="452" font-weight="bold" fill="#c0392b">Unplug before re-pushing any wire.</text>
</g>
</svg>
